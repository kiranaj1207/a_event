services:
  - type: web
    name: imarticus-datathon-2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: GOOGLE_FORM_ACTION_URL
